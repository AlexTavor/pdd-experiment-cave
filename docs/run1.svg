<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
     role="img" aria-label="Run 1: a raw agent and the full method compared on real issues, high-severity issues and cost">
  <title>Run 1: raw agent against the full method</title>
  <text x="20" y="28" fill="#7d8590" font-size="15" font-weight="700">Run 1: raw agent against the full method</text>
  <text x="20" y="46" fill="#7d8590" font-size="12">9 engine subsystems, blind-adjudicated. Panels are scaled independently.</text>

  <g>
    <text x="115" y="66" fill="#7d8590" font-size="13" font-weight="600"
          text-anchor="middle" letter-spacing="0.4">real issues</text>
    <line x1="20" y1="232.5" x2="210" y2="232.5"
          stroke="#7d8590" stroke-opacity="0.35"/>
    
    <rect x="58" y="203" width="56" height="29" fill="#58a6ff" rx="2"/>
    <text x="86" y="194" fill="#58a6ff" font-size="16" font-weight="700"
          text-anchor="middle">37</text>
    
    <rect x="138" y="114" width="56" height="118" fill="#f0883e" rx="2"/>
    <text x="166" y="105" fill="#f0883e" font-size="16" font-weight="700"
          text-anchor="middle">150</text>
    <text x="86" y="252" fill="#7d8590" font-size="12"
          text-anchor="middle">raw</text>
    <text x="166" y="252" fill="#7d8590" font-size="12"
          text-anchor="middle">full</text>
  </g>

  <g>
    <text x="370" y="66" fill="#7d8590" font-size="13" font-weight="600"
          text-anchor="middle" letter-spacing="0.4">high-severity real</text>
    <line x1="275" y1="232.5" x2="465" y2="232.5"
          stroke="#7d8590" stroke-opacity="0.35"/>
    
    <rect x="313" y="114" width="56" height="118" fill="#58a6ff" rx="2"/>
    <text x="341" y="105" fill="#58a6ff" font-size="16" font-weight="700"
          text-anchor="middle">4</text>
    
    <rect x="393" y="114" width="56" height="118" fill="#f0883e" rx="2"/>
    <text x="421" y="105" fill="#f0883e" font-size="16" font-weight="700"
          text-anchor="middle">4</text>
    <text x="341" y="252" fill="#7d8590" font-size="12"
          text-anchor="middle">raw</text>
    <text x="421" y="252" fill="#7d8590" font-size="12"
          text-anchor="middle">full</text>
  </g>

  <g>
    <text x="625" y="66" fill="#7d8590" font-size="13" font-weight="600"
          text-anchor="middle" letter-spacing="0.4">cost (USD)</text>
    <line x1="530" y1="232.5" x2="720" y2="232.5"
          stroke="#7d8590" stroke-opacity="0.35"/>
    
    <rect x="568" y="202" width="56" height="30" fill="#58a6ff" rx="2"/>
    <text x="596" y="193" fill="#58a6ff" font-size="16" font-weight="700"
          text-anchor="middle">~$125</text>
    
    <rect x="648" y="114" width="56" height="118" fill="#f0883e" rx="2"/>
    <text x="676" y="105" fill="#f0883e" font-size="16" font-weight="700"
          text-anchor="middle">~$484</text>
    <text x="596" y="252" fill="#7d8590" font-size="12"
          text-anchor="middle">raw</text>
    <text x="676" y="252" fill="#7d8590" font-size="12"
          text-anchor="middle">full</text>
  </g>
  <text x="20" y="288" fill="#7d8590" font-size="12">Four times the findings, four times the cost, and the same four high-severity issues.</text>
</svg>
